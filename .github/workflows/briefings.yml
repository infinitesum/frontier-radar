name: Generate academic daily weekly and monthly briefings

# GitHub Pages is the delivery channel. This job never schedules a ChatGPT task.
# Push of this workflow file builds the first daily, weekly, and monthly editions.
on:
  push:
    paths:
      - '.github/workflows/briefings.yml'
  schedule:
    - cron: '43 11 * * *'
      timezone: 'Asia/Shanghai'
    - cron: '13 20 * * 0'
      timezone: 'Asia/Shanghai'
    - cron: '31 20 1 * *'
      timezone: 'Asia/Shanghai'
  workflow_dispatch:
    inputs:
      kind:
        description: 'Which report to generate (all for a one-off bootstrap)'
        required: true
        type: choice
        default: daily
        options:
          - daily
          - weekly
          - monthly
          - all

permissions:
  contents: write
  actions: read
  pages: write
  id-token: write

concurrency:
  group: frontier-radar-pages
  cancel-in-progress: false

jobs:
  author-and-archive:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment_retry.outputs.page_url || steps.deployment_final.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: true
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Generate research editions (source-backed)
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.RADAR_LLM_MODEL || 'gpt-4.1-mini' }}
          KIND: ${{ inputs.kind || (github.event_name == 'push' && 'all' || (github.event.schedule == '13 20 * * 0' && 'weekly' || github.event.schedule == '31 20 1 * *' && 'monthly' || 'daily')) }}
        run: python scripts/generate_reports.py --kind "$KIND"
      - name: Test and validate reports
        run: |
          python -m unittest discover -s tests -v
          python scripts/validate.py
          python scripts/validate_reports.py
      - name: Version research briefing archive
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/reports.json data/editions/
          if ! git diff --cached --quiet; then
            git commit -m "reports: refresh academic reading editions"
            git push
          fi
      # GITHUB_TOKEN commits do not trigger ordinary on:push workflows.
      # Deploy the just-generated reports in this same job.
      - name: Build updated website
        run: python scripts/build_site.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      # The GitHub artifact service can take several seconds after a successful upload
      # to expose the artifact through the REST API. Wait for it instead of failing Pages.
      - name: Wait for Pages artifact visibility
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in $(seq 1 12); do
            count="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts" --jq '[.artifacts[] | select(.name == "github-pages" and .expired == false)] | length' 2>/dev/null || true)"
            if [ "$count" = "1" ]; then
              echo "Pages artifact is visible (attempt ${attempt})"
              exit 0
            fi
            echo "Pages artifact not visible yet (attempt ${attempt}/12)"
            sleep 5
          done
          echo "::error::Pages artifact not visible through the GitHub Actions API after 60 seconds"
          exit 1
      # Retry deployment, not the upload: rerunning uploads can create duplicate
      # github-pages artifacts and make deploy-pages fail deterministically.
      - name: Deploy updated research briefings
        id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true
      - name: Delay before Pages deployment retry
        if: steps.deployment.outcome == 'failure'
        run: sleep 15
      - name: Retry Pages deployment
        id: deployment_retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
        continue-on-error: true
      - name: Delay before final Pages deployment attempt
        if: steps.deployment.outcome == 'failure' && steps.deployment_retry.outcome == 'failure'
        run: sleep 30
      - name: Final Pages deployment attempt
        id: deployment_final
        if: steps.deployment.outcome == 'failure' && steps.deployment_retry.outcome == 'failure'
        uses: actions/deploy-pages@v4
