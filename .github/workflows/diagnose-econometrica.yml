name: Diagnose Econometrica public metadata
on:
  push:
    paths: ['.github/workflows/diagnose-econometrica.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Compare Crossref identification routes
        shell: bash
        run: |
          python - <<'PY'
          import json
          from urllib.request import urlopen, Request
          from urllib.parse import urlencode, quote
          urls = {
              "doi": "https://api.crossref.org/works/10.3982%2FECTA945FM",
              "online_issn": "https://api.crossref.org/journals/1468-0262/works?" + urlencode({"rows": 2, "sort": "published", "order": "desc", "select": "DOI,title,container-title,ISSN,published"}),
              "paper_issn": "https://api.crossref.org/journals/0012-9682/works?" + urlencode({"rows": 2, "sort": "published", "order": "desc", "select": "DOI,title,container-title,ISSN,published"}),
              "container_search": "https://api.crossref.org/works?" + urlencode({"query.container-title": "Econometrica", "filter": "from-pub-date:2026-07-01", "rows": 8, "select": "DOI,title,container-title,ISSN,published,type"}),
              "prefix_search": "https://api.crossref.org/prefixes/10.3982/works?" + urlencode({"filter": "from-pub-date:2026-07-01", "rows": 8, "select": "DOI,title,container-title,ISSN,published,type"}),
          }
          for label,url in urls.items():
              try:
                  req=Request(url,headers={"User-Agent":"FrontierRadar/0.1 diagnostics"})
                  with urlopen(req,timeout=25) as res: data=json.loads(res.read(1500000))
                  m=data.get("message",{})
                  if isinstance(m,dict) and "items" in m:
                      print(label, "total",m.get("total-results"), "samples",[(x.get("DOI"),x.get("container-title"),x.get("ISSN")) for x in m.get("items",[])[:4]])
                  else: print(label,"doi",m.get("DOI"),"ISSN",m.get("ISSN"),"container",m.get("container-title"),"published",m.get("published"))
              except Exception as e:
                  print(label,"error",type(e).__name__,str(e)[:160])
          PY
