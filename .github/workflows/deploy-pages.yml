name: Build and publish dashboard

# No cron trigger is present. Publishing happens on code changes or manual runs.
on:
  push:
    branches: [main]
    paths-ignore:
      - '.github/workflows/briefings.yml'
      - '.github/workflows/refresh-manual.yml'
      - 'data/reports.json'
      - 'data/editions/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: frontier-radar-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Test data pipeline
        run: |
          python -m unittest discover -s tests -v
          python scripts/validate.py
      - name: Build static dashboard
        run: python scripts/build_site.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
